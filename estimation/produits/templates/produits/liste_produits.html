<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Produits</h1>
    <table class="table">
        <thead>
            <tr>
                <th>Nom</th>
                <th>Poids</th>
                <th>Prix Réel</th>
                <th>Prix Estimé</th>
            </tr>
        </thead>
        <tbody>
            {% for produit in produits %}
            <tr>
                <td>{{ produit.nom }}</td>
                <td>{{ produit.poids }} kg</td>
                <td>{{ produit.prix_reel }} €</td>
                <td>{{ produit.prix_estime|floatformat:2 }} €</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'ajouter_produit' %}" class="btn btn-primary">Ajouter un nouveau produit</a>
</body>
</html>
